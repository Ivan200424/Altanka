version: '3.8'

services:
  # PostgreSQL database for both services
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-altanka}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-altanka_password}
      - POSTGRES_DB=${POSTGRES_DB:-altanka_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-altanka}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - altanka-network

  # Node.js API service (existing)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - API_KEY=${API_KEY}
      - PORT=${API_PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-altanka}:${POSTGRES_PASSWORD:-altanka_password}@postgres:5432/${POSTGRES_DB:-altanka_db}
      - TZ=${TZ:-Europe/Kyiv}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - altanka-network

  # Python Telegram bot service (new)
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-altanka}:${POSTGRES_PASSWORD:-altanka_password}@postgres:5432/${POSTGRES_DB:-altanka_db}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-5}
      - TZ=${TZ:-Europe/Kyiv}
      - PLAYWRIGHT_TIMEOUT=30000
      - MAX_RETRIES=3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - altanka-network
    # Share Playwright cache
    volumes:
      - playwright_cache:/root/.cache/ms-playwright

networks:
  altanka-network:
    driver: bridge

volumes:
  postgres_data:
  playwright_cache:
